<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up page</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="main-wrapper">
        <div class="left-section">
            <div class="logo">
                <span class="logo-mark">V</span>
                <span class="logo-divider"></span>
                <span class="logo-name">TXNISH</span>
            </div>
            <div class="bg-black">
            <h1>Create Something<br>
            <span>extraordinary.</span>
            </h1>
            <p id="tagline">Your creative journey starts here.</p>
            </div>
            <div class="social-icon">
                <i class="fa-brands fa-instagram"></i>
                <i class="fa-brands fa-facebook"></i>
                <i class="fa-brands fa-twitter"></i>    
                <i class="fa-brands fa-linkedin"></i>
            </div>
        </div>
    <div class="right-section">
    <div class="container">
    <form action="" id="myform" novalidate>
    <h2>Create your 
    <span class="gold-text">account</span></h2>
<p id="form-subtitle">Start your creative journey with us.</p>
    <h3>
    <i class="fa-solid fa-user"></i>
    Full Name</h3>
    <input type="text" placeholder="Enter your name" id="name">
    <p id="p1"></p>
    <h3>
    <i class="fa-solid fa-envelope"></i>
    Email Address</h3>
    <input type="email" placeholder="Enter your email" id="email">
    <p id="p2"></p>
    <h3>
    <i class="fa-solid fa-lock"></i>
    password</h3>
    <div class="password-box">
        <input type="password" placeholder="Enter your password" id="pass">
        <button type="button" id="togglepass"><i class="fa-solid fa-eye"></i></button>
    </div>
    
    <p id="p3"></p>
    <p id="hint"></p>
    <button>Submit</button>
    </form>
    <p class="signin">
    Already have an account? <a href="#">Sign in</a>
    </p>
    <P id="success"></P>
    </div>
    </div>
    </div>
     <!-- <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script> -->
    <script src="app2.js"></script>
</body>
</html>
